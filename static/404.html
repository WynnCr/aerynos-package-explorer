<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>aerynOS package explorer</title>
<script>
  // GitHub Pages SPA redirect hack
  // Store the full path and redirect to index
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + (l.pathname.split('/').slice(1)[0] === '' ? 0 : 1)).join('/') +
    '/?p=' + l.pathname.slice(1).split('/').join('/') +
    (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body>Redirecting...</body>
</html>
