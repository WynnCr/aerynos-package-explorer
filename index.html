<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#131211" />
    <meta name="description" content="Search the recipes in the AerynOS package tree. Unofficial; not run by the AerynOS project." />
    <meta property="og:title" content="AerynOS package explorer (unofficial)" />
    <meta property="og:description" content="Search the recipes in the AerynOS package tree. Unofficial; not run by the AerynOS project." />
    <title>AerynOS package explorer (unofficial)</title>
    <!-- GitHub Pages SPA Redirect Handler -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var cleanPath = p.replace(/^\/+/, '');
          var pathSegments = window.location.pathname.split('/').filter(Boolean);
          if (pathSegments.length > 0 && cleanPath.startsWith(pathSegments[0] + '/')) {
            cleanPath = cleanPath.slice(pathSegments[0].length + 1);
          }
          var q = params.get('q');
          var hashTarget = '#/' + cleanPath + (q ? '?' + q.replace(/~and~/g, '&') : '') + window.location.hash.replace(/^#/, '');
          window.location.replace(window.location.pathname + hashTarget);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
