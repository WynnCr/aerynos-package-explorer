<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover, search, and explore packages available in AerynOS — a modern, atomic Linux distribution." />
    <meta property="og:title" content="AerynOS Package Explorer" />
    <meta property="og:description" content="Search and browse all packages in the AerynOS ecosystem" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>AerynOS Package Explorer</title>
    <!-- GitHub Pages SPA Redirect Handler -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var cleanPath = p.replace(/^\/+/, '');
          var pathSegments = window.location.pathname.split('/').filter(Boolean);
          if (pathSegments.length > 0 && cleanPath.startsWith(pathSegments[0] + '/')) {
            cleanPath = cleanPath.slice(pathSegments[0].length + 1);
          }
          var q = params.get('q');
          var hashTarget = '#/' + cleanPath + (q ? '?' + q.replace(/~and~/g, '&') : '') + window.location.hash.replace(/^#/, '');
          window.location.replace(window.location.pathname + hashTarget);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
