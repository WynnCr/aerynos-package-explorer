name: Update Package Index & Deploy

on:
  schedule:
    - cron: '17 */4 * * *'  # Runs every 4 hours at :17 UTC (00:17, 04:17, 08:17, 12:17, 16:17, 20:17)
  workflow_dispatch:      # Allows manual trigger anytime from the Actions tab
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # to commit the refreshed index
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch live repository stream metadata
        # Non-fatal: on failure the committed channels.json is kept as is.
        run: python3 scripts/fetch-channels.py || echo "::warning::channels.json not refreshed"

      - name: Generate package index
        # Shallow-clones aerynOS/recipes itself and fails if the result looks wrong.
        run: pnpm generate-index

      - name: Validate dataset
        run: pnpm validate-dataset

      - name: Commit updated index if changed
        run: |
          # status (not diff) so brand-new files under static/data/details count too
          if [ -n "$(git status --porcelain static/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A static/data
            PACKAGE_COUNT=$(node -e "const d=require('./static/data/packages.json');console.log(d.totalCount)")
            git commit -m "chore: auto-update package index (${PACKAGE_COUNT} packages) [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "Pushed updated package index."
          else
            echo "Package index is already up to date with official recipes."
          fi

      - name: Build static website
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build-and-index
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
