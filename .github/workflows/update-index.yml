name: Update Package Index & Deploy

on:
  schedule:
    - cron: '0 2 * * *'  # Automatically runs daily at 02:00 UTC
  workflow_dispatch:      # Allows manual trigger anytime from the Actions tab
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'package.json'
      - 'vite.config.ts'

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clone latest official recipes
        run: git clone --depth 1 https://github.com/aerynOS/recipes.git /tmp/aerynos-recipes

      - name: Generate package index
        run: pnpm exec tsx scripts/generate-index.ts --local /tmp/aerynos-recipes

      - name: Commit updated index if changed
        run: |
          if ! git diff --quiet static/data/packages.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add static/data/packages.json
            PACKAGE_COUNT=$(node -e "const d=require('./static/data/packages.json');console.log(d.totalCount)")
            git commit -m "chore: auto-update package index (${PACKAGE_COUNT} packages) [skip ci]"
            git push
            echo "Pushed updated package index."
          else
            echo "Package index is already up to date with official recipes."
          fi

      - name: Build static website
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-and-index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
